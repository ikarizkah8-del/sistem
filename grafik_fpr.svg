<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">
  <style>
    .ink   { fill:#0b0b0b; }
    .sec   { fill:#52514e; }
    .mut   { fill:#898781; }
    .grid  { stroke:#e1e0d9; stroke-width:1; }
    .base  { stroke:#c3c2b7; stroke-width:1.5; }
    .s1    { fill:#2a78d6; }
    .s2    { fill:#eb6834; }
    .t     { font-size:13px; }
    .tick  { font-size:12px; font-variant-numeric:tabular-nums; }
    .val   { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
    .head  { font-size:15px; font-weight:700; }
    .axis  { font-size:12px; }
  </style>
  <rect x="0" y="0" width="980" height="450" fill="#fcfcfb"/>

  <!-- legenda -->
  <rect class="s1" x="310" y="32" width="13" height="13" rx="3"/>
  <text class="t sec" x="330" y="43">Isolation Forest</text>
  <rect class="s2" x="470" y="32" width="13" height="13" rx="3"/>
  <text class="t sec" x="490" y="43">Local Outlier Factor</text>

  <!-- ================= panel 1: Recall ================= -->
  <text class="head ink" x="270" y="76" text-anchor="middle">Recall</text>
  <g class="grid">
    <line x1="70" y1="100" x2="470" y2="100"/>
    <line x1="70" y1="160" x2="470" y2="160"/>
    <line x1="70" y1="220" x2="470" y2="220"/>
    <line x1="70" y1="280" x2="470" y2="280"/>
    <line x1="70" y1="340" x2="470" y2="340"/>
  </g>
  <g class="tick mut" text-anchor="end">
    <text x="62" y="104">100</text><text x="62" y="164">80</text><text x="62" y="224">60</text>
    <text x="62" y="284">40</text><text x="62" y="344">20</text><text x="62" y="404">0</text>
  </g>
  <line class="base" x1="70" y1="400" x2="470" y2="400"/>

  <path class="s1" d="M112 400 V139.2 Q112 135.2 116 135.2 H164 Q168 135.2 168 139.2 V400 Z"/>
  <text class="val ink" x="140" y="127" text-anchor="middle">88,26%</text>
  <path class="s2" d="M172 400 V306.9 Q172 302.9 176 302.9 H224 Q228 302.9 228 306.9 V400 Z"/>
  <text class="val ink" x="200" y="294" text-anchor="middle">32,38%</text>

  <path class="s1" d="M312 400 V123.4 Q312 119.4 316 119.4 H364 Q368 119.4 368 123.4 V400 Z"/>
  <text class="val ink" x="340" y="111" text-anchor="middle">93,55%</text>
  <path class="s2" d="M372 400 V105.0 Q372 101.0 376 101.0 H424 Q428 101.0 428 105.0 V400 Z"/>
  <text class="val ink" x="400" y="93" text-anchor="middle">99,67%</text>

  <text class="axis sec" x="170" y="422" text-anchor="middle">Target FPR 1%</text>
  <text class="axis sec" x="370" y="422" text-anchor="middle">Target FPR 5%</text>

  <!-- ================= panel 2: Precision ================= -->
  <text class="head ink" x="760" y="76" text-anchor="middle">Precision</text>
  <g class="grid">
    <line x1="560" y1="100" x2="960" y2="100"/>
    <line x1="560" y1="160" x2="960" y2="160"/>
    <line x1="560" y1="220" x2="960" y2="220"/>
    <line x1="560" y1="280" x2="960" y2="280"/>
    <line x1="560" y1="340" x2="960" y2="340"/>
  </g>
  <g class="tick mut" text-anchor="end">
    <text x="552" y="104">100</text><text x="552" y="164">80</text><text x="552" y="224">60</text>
    <text x="552" y="284">40</text><text x="552" y="344">20</text><text x="552" y="404">0</text>
  </g>
  <line class="base" x1="560" y1="400" x2="960" y2="400"/>

  <path class="s1" d="M602 400 V106.9 Q602 102.9 606 102.9 H654 Q658 102.9 658 106.9 V400 Z"/>
  <text class="val ink" x="630" y="94" text-anchor="middle">99,05%</text>
  <path class="s2" d="M662 400 V113.3 Q662 109.3 666 109.3 H714 Q718 109.3 718 113.3 V400 Z"/>
  <text class="val ink" x="690" y="101" text-anchor="middle">96,89%</text>

  <path class="s1" d="M802 400 V115.7 Q802 111.7 806 111.7 H854 Q858 111.7 858 115.7 V400 Z"/>
  <text class="val ink" x="830" y="103" text-anchor="middle">96,10%</text>
  <path class="s2" d="M862 400 V115.3 Q862 111.3 866 111.3 H914 Q918 111.3 918 115.3 V400 Z"/>
  <text class="val ink" x="890" y="103" text-anchor="middle">96,25%</text>

  <text class="axis sec" x="660" y="422" text-anchor="middle">Target FPR 1%</text>
  <text class="axis sec" x="860" y="422" text-anchor="middle">Target FPR 5%</text>

  <text class="axis mut" x="20" y="250" text-anchor="middle" transform="rotate(-90 20 250)">Nilai (%)</text>
</svg>
